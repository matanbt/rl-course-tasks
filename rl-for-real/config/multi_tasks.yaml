# RL for Real - GRPO Training Configuration
# ==========================================
#
# Usage:
#   python train_grpo.py --config config/multi_tasks.yaml
#
# Override any setting via command line:
#   python train_grpo.py --config config/multi_tasks.yaml max_steps=100

run_name: grpo

# =============================================================================
# Dataset Configuration
# =============================================================================

dataset_size: 20000
developer_prompt: Focused  # Format rules + follow the question + ~300-word thinking budget, hosted in grpo/prompts.py (DeepSeekZero is the original)
developer_role: system

# Training datasets (from reasoning-gym)
# Each dataset gets procedurally generated problems
# family_relationships is upweighted: its questions ask for a single word, so the model answers without the answer
# tags, every rollout scores 0 and its groups carry no learning signal. It is also the largest eval task.
# number_filtering and maze have the most headroom and need real reasoning; string_insertion is saturated (85-100% of
# rollouts exact, so its groups rarely carry signal). Short-answer tasks dominating training made the reasoning shrink
# over time (base_conversion 314 -> 187 tokens and 29 -> 2/36 correct in the best run).
datasets: {"number_filtering": {"weight": 1.5}, "string_insertion": {"weight": 0.5}, "family_relationships": {"weight": 2.0}, "maze": {"weight": 1.5}}

# Evaluation datasets (optional)
# If not specified (null/omitted), uses the same config as training datasets.
eval_datasets: {"number_filtering": {}, "string_insertion": {}, "family_relationships": {}, "maze": {}, "base_conversion": {}}

# =============================================================================
# Model Configuration
# =============================================================================

model_name_or_path: Qwen/Qwen2.5-3B-Instruct
#model_name_or_path: unsloth/Llama-3.2-1B-Instruct

# =============================================================================
# Training Hyperparameters
# =============================================================================

# Resume control
auto_resume: false  # If true, auto-resume from last checkpoint in output_dir

# Training steps
max_steps: 500
batch_counts_as_step: false  # Note: this is used to compare runs with different batch-sizes - presenting results vs. train data (instead of vs. model updates).
num_train_epochs: 1  # Note: in our setting, this is practically irrelevant, since max_steps does not allow reaching a second epoch anyway.

# Batch sizes
# 4 per device x 2 accumulation = 8 completions per GPU per step, so the completions per step (8 x num_processes)
# stay divisible by num_generations (8) with any number of GPUs, e.g. 4 GPUs -> 4 prompts x 8 rollouts per step.
per_device_eval_batch_size: 64
per_device_train_batch_size: 4
gradient_accumulation_steps: 2

# Learning rate
learning_rate: 2e-5  # LoRA needs a much higher learning rate than full fine-tuning (2e-6)
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
lr_scheduler_kwargs:
  num_warmup_steps: 10

# GRPO-specific
num_generations: 8  # Rollouts per prompt (more rollouts -> more groups where some rollout differs, i.e. learning signal)
reward_weights:  # Weights for [accuracy_reward, format_reward]
  - 1.0
  - 1.0
binary_accuracy_reward: true  # Reward exact answers, as the eval counts them (no reasoning-gym partial credit)
partial_credit_tasks: [number_filtering, maze]  # ...but credit closeness for these (grpo/partial_credit.py)
partial_credit_max: 0.5
strict_format_reward: true  # Half the format reward needs one <think>, then one single-line <answer>, and nothing else
overlong_penalty_start: 384  # The format reward drops linearly from 384 tokens to max_completion_length
max_completion_length: 512  # The eval generates at most 512 tokens, so more would never help

# Model behavior
temperature: 1.0  # training temperature (more exploration; at 0.6 family_relationships rollouts almost never used tags)
eval_temperature: 0.0  # eval temperature (0 = greedy/deterministic, so evals differ only because the model did)

# LORA
# The LoRA adapters train in fp32 (PEFT's default). Full fine-tuning updates the bf16 weights directly, and at lr 2e-6
# most of those updates are below bf16 resolution and round away. LoRA learned faster in our runs.
use_peft: true
lora_r: 64
lora_alpha: 64
lora_dropout: 0.0  # dropout would add noise between the policy that samples the rollouts and the one being trained
lora_target_modules: all-linear  # adapt every linear layer (unset = PEFT default, only q_proj/v_proj for Qwen2)

# =============================================================================
# Evaluation & Checkpointing
# =============================================================================

output_dir: outputs

# Eval-only mode (set via command line)
eval_only: false           # Set to true to skip training and only evaluate
checkpoint_path: null      # Path to trained model/checkpoint for eval-only mode

# Fixed evaluation settings
eval_num_samples: 200
eval_num_examples_to_print: 5
fixed_eval_steps: 10  # Run fixed eval every N steps (a multiple of logging_steps: evals run on logging steps)
save_best_k: 3  # keep the 3 best checkpoints by fixed-eval accuracy in <output_dir>/best_checkpoints/

# Variance logging (helps diagnose exploration)
log_reward_variance: true
verbose_variance_logging: false  # Set to true for detailed per-prompt output

#eval_strategy: steps
#eval_steps: 100
#eval_delay: 0

save_strategy: steps
save_steps: 100  # resumable checkpoints (with optimizer state); keep below max_steps
save_total_limit: 3

logging_steps: 10
logging_first_step: true

# =============================================================================
# Optimization
# =============================================================================

bf16: true
gradient_checkpointing: true
seed: 42

# =============================================================================
# Logging
# =============================================================================

report_to: wandb  # or "none" to disable
